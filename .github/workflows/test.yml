name: Validate Firebase integration
on:
  push:
    branches: [feat/firebase-seguro]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run build
      - run: npx --yes firebase-tools@15.35.0 emulators:exec --only firestore --project demo-notebooks-tests "npm run test:emulator"
